name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python scripts/validate_project.py
      - run: uv run python -m unittest discover -s tests -p "test_*.py"
      - run: uv run python .agents/skills/thesis-research-and-writing/scripts/lint_vi_academic.py tests/fixtures/style_grounded_vi.md --fail-on-error
